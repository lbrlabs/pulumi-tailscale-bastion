# yaml-language-server: $schema=https://raw.githubusercontent.com/pulumi/pulumi/master/pkg/codegen/schema/pulumi.json
---
name: tailscale-bastion
pluginDownloadUrl: "github://api.github.com/lbrlabs"
description: "A Pulumi package for creating a tailscale bastion in AWS."
repository: "https://github.com/lbrlabs/pulumi-tailscale-bastion"
publisher: "lbrlabs"
displayname: "tailscale-bastion"
keywords:
  - aws
  - tailscale
  - lbrlabs
  - kind/component
  - category/network
types:
  tailscale-bastion:aws:WorkloadIdentity:
    type: object
    description: "Tailscale federated identity for automatic AWS workload authentication (Tailscale 1.94+)."
    properties:
      clientId:
        type: string
        description: "The Tailscale federated identity client ID."
      audience:
        type: string
        description: "The audience configured for the Tailscale federated identity."
    required:
      - clientId
      - audience
  tailscale-bastion:index:PeerRelaySettings:
    type: object
    description: "Settings for configuring this node as a peer relay server."
    properties:
      enable:
        type: boolean
        description: "Whether to enable peer relay functionality."
        default: false
      port:
        type: integer
        description: "The port to use for the relay server."
        default: 12345
resources:
  tailscale-bastion:azure:Bastion:
    isComponent: true
    inputProperties:
      enableSSH:
        type: boolean
        description: "Whether to enable SSH access to the bastion."
        default: true
      peerRelaySettings:
        "$ref": "#/types/tailscale-bastion:index:PeerRelaySettings"
        description: "Settings for configuring this node as a peer relay server."
      resourceGroupName:
        type: string
        description: "The Azure resource group to create the bastion in."
      subnetId:
        type: string
        description: "The subnet Ids to launch instances in."
      routes:
        type: array
        items:
          type: string
        description: "The routes you'd like to advertise via tailscale."
      location:
        type: string
        description: "The Azure region you're using."
      instanceSku:
        type: string
        description: "The Azure instance SKU to use for the bastion."
      highAvailability:
        type: boolean
        description: "Whether the bastion should be highly available."
        default: false
      public:
        type: boolean
        description: "Whether the bastion should have a public IP."
        default: false
      tailscaleTags:
        type: array
        items:
          type: string
        description: "The tags to apply to the tailnet device andauth key. This tag should be added to your oauth key and ACL."
    requiredInputs:
      - highAvailability
      - resourceGroupName
      - subnetId
      - routes
      - location
      - tailscaleTags
    properties:
      scaleSetName:
        type: string
        description: "The name of the Scaleset that managed the bastion instances"
      privateKey:
        type: string
        description: "The SSH private key to access your bastion"
    required:
      - scaleSetName
      - privateKey
  tailscale-bastion:aws:Bastion:
    isComponent: true
    inputProperties:
      track:
        type: string
        description: "Tailscale installation release track: stable or unstable."
        default: stable
      maxRetries:
        type: integer
        description: "Maximum installation and authentication attempts. Must be at least 1."
        default: 10
      retryDelay:
        type: integer
        description: "Seconds between installation and authentication attempts. Must be non-negative."
        default: 10
      json:
        type: boolean
        description: "Whether tailscale up emits JSON output."
        default: false
      loginServer:
        type: string
        description: "Tailscale control server URL."
        default: https://controlplane.tailscale.com
      reset:
        type: boolean
        description: "Reset unspecified preferences to defaults when running tailscale up."
        default: false
      timeout:
        type: string
        description: "Maximum time to wait for tailscale up, as a Go duration. Zero waits indefinitely."
        default: 60s
      forceReauth:
        type: boolean
        description: "Force reauthentication when running tailscale up."
        default: false
      acceptDNS:
        type: boolean
        description: "Accept DNS configuration from the tailnet."
        default: true
      acceptRoutes:
        type: boolean
        description: "Accept subnet routes advertised by other tailnet nodes."
        default: false
      shieldsUp:
        type: boolean
        description: "Block incoming connections from other tailnet nodes."
        default: false
      snatSubnetRoutes:
        type: boolean
        description: "Source NAT traffic to advertised subnet routes."
        default: true
      netfilterMode:
        type: string
        description: "Netfilter management mode: on, off, or nodivert."
        default: "on"
      statefulFiltering:
        type: boolean
        description: "Enable stateful filtering for forwarded packets."
        default: false
      exitNode:
        type: string
        description: "IP address or name of the exit node to use for outgoing traffic."
        default: ""
      exitNodeAllowLANAccess:
        type: boolean
        description: "Allow direct access to the local network while using an exit node."
        default: false
      operator:
        type: string
        description: "Local Unix user allowed to operate tailscaled without sudo."
        default: ""
      hostname:
        type: string
        description: "The hostname of the bastion."
      public:
        type: boolean
        description: "Whether the bastion is going in public subnets."
        default: false
      enableSSH:
        type: boolean
        description: "Whether to enable SSH access to the bastion."
        default: true
      peerRelaySettings:
        "$ref": "#/types/tailscale-bastion:index:PeerRelaySettings"
        description: "Settings for configuring this node as a peer relay server."
      enableAppConnector:
        type: boolean
        description: "Whether the bastion advertises itself as an app connector."
        default: false
      enableExitNode:
        type: boolean
        description: "Whether the subnet router can advertise itself as an exit node."
        default: false
      highAvailability:
        type: boolean
        description: "Whether the bastion should be highly available."
        default: false
      vpcId:
        type: string
        description: "The VPC the Bastion should be created in."
      tailscaleTags:
        type: array
        items:
          type: string
        description: "The tags to apply to the tailnet device andauth key. This tag should be added to your oauth key and ACL."
      subnetIds:
        type: array
        items:
          type: string
        description: "The subnet Ids to launch instances in."
      routes:
        type: array
        items:
          type: string
        description: "The routes you'd like to advertise via tailscale."
      region:
        type: string
        description: "The AWS region you're using."
      instanceType:
        type: string
        description: "The EC2 instance type to use for the bastion."
      oauthClientSecret:
        type: string
        description: "An OAuth Client Secret to use for authenticating Tailscale clients."
      workloadIdentity:
        "$ref": "#/types/tailscale-bastion:aws:WorkloadIdentity"
        description: "Authenticate using the EC2 instance role instead of a stored key. Mutually exclusive with oauthClientSecret."
      architecture:
        type: string
        description: "The CPU architecture for the bastion (x86_64 or arm64)."
        enum:
          - x86_64
          - arm64
        default: x86_64
    requiredInputs:
      - highAvailability
      - vpcId
      - subnetIds
      - region
      - tailscaleTags
    properties:
      asgName:
        type: string
        description: "The name of the ASG that managed the bastion instances"
      roleArn:
        type: string
        description: "The instance IAM role ARN to match in the Tailscale federated identity trust configuration."
      privateKey:
        type: string
        description: "The SSH private key to access your bastion"
    required:
      - asgName
      - privateKey
  tailscale-bastion:kubernetes:Bastion:
    isComponent: true
    inputProperties:
      highAvailability:
        type: boolean
        description: "Whether the bastion should be highly available."
        default: false
      tailscaleTags:
        type: array
        items:
          type: string
        description: "The tags to apply to the tailnet device andauth key. This tag should be added to your oauth key and ACL."
      createNamespace:
        type: boolean
        description: "Whether we should create a new namespace."
        plain: true
      namespace:
        "$ref": "/kubernetes/v4.34.3/schema.json#/resources/kubernetes:core%2Fv1:Namespace"
        description: The bucket resource.
      routes:
        type: array
        items:
          type: string
        description: "The routes to advertise to tailscale. This is likely the Pod and Service CIDR."
    requiredInputs:
      - highAvailability
      - createNamespace
      - routes
      - tailscaleTags
    properties:
      deploymentName:
        type: string
        description: "The name of the kubernetes deployment that contains the tailscale bastion"
    required:
      - deploymentName
language:
  csharp:
    packageReferences:
      Pulumi: 3.*
      Pulumi.Aws: 7.*
      Pulumi.Azure: 6.*
      Pulumi.Kubernetes: 4.*
      Pulumi.Tls: 5.*
      Pulumi.Tailscale: 0.*
    rootNamespace: "Lbrlabs.PulumiPackage"
  go:
    generateResourceContainerTypes: true
    importBasePath: github.com/lbrlabs/pulumi-tailscale-bastion/sdk/go/bastion
  nodejs:
    dependencies:
      "@pulumi/aws": "^7.55.0"
      "@pulumi/azure": "^6.40.2"
      "@pulumi/tls": "^5.6.3"
      "@pulumi/kubernetes": "^4.34.3"
      "@pulumi/tailscale": "^0.30.0"
    devDependencies:
      typescript: "^6.0.3"
      glob: "^14.0.6"
      minimatch: "^11.0.8"
    packageName: "@lbrlabs/pulumi-tailscalebastion"
  python:
    packageName: "lbrlabs_pulumi_tailscalebastion"
    requires:
      pulumi: ">=3.276.0,<4.0.0"
      pulumi-kubernetes: ">=4.34.3,<5.0.0"
      pulumi-aws: ">=7.55.0,<8.0.0"
      pulumi-azure: ">=6.40.2,<7.0.0"
      pulumi-tls: ">=5.6.3,<6.0.0"
      pulumi-tailscale: ">=0.30.0,<1.0.0"
